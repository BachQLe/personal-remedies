<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- No hand-written <link rel="manifest">: vite-plugin-pwa injects the
         manifest link (pointing at the generated manifest.webmanifest, built
         from vite.config.js's `manifest` option) into every build's <head>
         automatically. A second, hand-written public/manifest.json used to
         ship alongside it — removed (T7A) so there's exactly one manifest
         source of truth, version-controlled in vite.config.js. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#1B3A2D" />
    <meta name="description" content="Personal Remedies — individualized, evidence-based guidance for managing one chronic condition or several at once." />
    <title>Personal Remedies — Individualized help for chronic conditions</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
