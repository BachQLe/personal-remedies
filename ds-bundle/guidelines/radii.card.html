<!-- @dsCard group="Effects" viewport="700x130" name="Corner Radii" subtitle="From none (buttons) to pill (chips) — radius tokens" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 20px; font-family: var(--font-label); background: var(--surface-page); }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 8px; }
  .swatch { border-radius: 8px; text-align: center; }
  .label { font-size: 9px; color: var(--text-muted); margin-top: 4px; font-family: var(--font-label); letter-spacing: .06em; text-transform: uppercase; }
  .val { font-size: 8px; color: var(--text-muted); font-family: var(--font-label); }
</style></head><body style="padding:20px">
<div style="display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap">
<div style="text-align:center"><div style="width:64px;height:48px;background:var(--forest-100);border-radius:0px;border:1.5px solid var(--forest-300);margin-bottom:6px"></div><div class="label">none</div><div class="val">0px</div><div class="val" style="color:var(--forest-700)">Buttons</div></div><div style="text-align:center"><div style="width:64px;height:48px;background:var(--forest-100);border-radius:6px;border:1.5px solid var(--forest-300);margin-bottom:6px"></div><div class="label">xs</div><div class="val">6px</div><div class="val" style="color:var(--forest-700)">CTAs</div></div><div style="text-align:center"><div style="width:64px;height:48px;background:var(--forest-100);border-radius:10px;border:1.5px solid var(--forest-300);margin-bottom:6px"></div><div class="label">sm</div><div class="val">10px</div><div class="val" style="color:var(--forest-700)">Inputs</div></div><div style="text-align:center"><div style="width:64px;height:48px;background:var(--forest-100);border-radius:14px;border:1.5px solid var(--forest-300);margin-bottom:6px"></div><div class="label">md</div><div class="val">14px</div><div class="val" style="color:var(--forest-700)">Icon bg</div></div><div style="text-align:center"><div style="width:64px;height:48px;background:var(--forest-100);border-radius:20px;border:1.5px solid var(--forest-300);margin-bottom:6px"></div><div class="label">lg</div><div class="val">20px</div><div class="val" style="color:var(--forest-700)">Inner cards</div></div><div style="text-align:center"><div style="width:64px;height:48px;background:var(--forest-100);border-radius:28px;border:1.5px solid var(--forest-300);margin-bottom:6px"></div><div class="label">xl</div><div class="val">28px</div><div class="val" style="color:var(--forest-700)">Cards</div></div><div style="text-align:center"><div style="width:64px;height:48px;background:var(--forest-100);border-radius:999px;border:1.5px solid var(--forest-300);margin-bottom:6px"></div><div class="label">pill</div><div class="val">999px</div><div class="val" style="color:var(--forest-700)">Chips/tags</div></div>
</div>
</body></html>
