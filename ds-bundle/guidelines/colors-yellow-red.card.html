<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>

  .swatch { border-radius: 8px; text-align: center; }

</style></head><body>
<div class="label" style="margin-bottom:6px;font-size:10px;color:var(--text-secondary)">Yellow — caution</div>

</div>

<div class="row">
<div style="flex:1;min-width:0"><div class="swatch" style="height:44px;background:#FFF0F0"></div><div class="label">50</div></div><div style="flex:1;min-width:0"><div class="swatch" style="height:44px;background:#FFD8D8"></div><div class="label">100</div></div><div style="flex:1;min-width:0"><div class="swatch" style="height:44px;background:#FFBABA"></div><div class="label">200</div></div><div style="flex:1;min-width:0"><div class="swatch" style="height:44px;background:#F89898"></div><div class="label">300</div></div><div style="flex:1;min-width:0"><div class="swatch" style="height:44px;background:#F07070"></div><div class="label">400</div></div><div style="flex:1;min-width:0"><div class="swatch" style="height:44px;background:#E04848"></div><div class="label">500 ★</div></div><div style="flex:1;min-width:0"><div class="swatch" style="height:44px;background:#C83030"></div><div class="label">600</div></div><div style="flex:1;min-width:0"><div class="swatch" style="height:44px;background:#A82020"></div><div class="label">700</div></div><div style="flex:1;min-width:0"><div class="swatch" style="height:44px;background:#801414"></div><div class="label">800</div></div><div style="flex:1;min-width:0"><div class="swatch" style="height:44px;background:#580C0C"></div><div class="label">900</div></div><div style="flex:1;min-width:0"><div class="swatch" style="height:44px;background:#300404"></div><div class="label">950</div></div>
