<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 20px; font-family: var(--font-label); background: var(--surface-page); }

  .swatch { border-radius: 8px; text-align: center; }
  .label { font-size: 9px; color: var(--text-muted); margin-top: 4px; font-family: var(--font-label); letter-spacing: .06em; text-transform: uppercase; }
  .val { font-size: 8px; color: var(--text-muted); font-family: var(--font-label); }
</style></head><body style="padding:20px">
<div style="display:flex;gap:20px;align-items:flex-end;flex-wrap:wrap">
<div style="text-align:center"><div style="width:72px;height:48px;background:#fff;border-radius:12px;box-shadow:0 1px 2px rgba(45,36,24,.06);margin-bottom:8px"></div><div class="label">xs</div><div class="val" style="color:var(--forest-700)">Hairline</div></div><div style="text-align:center"><div style="width:72px;height:48px;background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(45,36,24,.06);margin-bottom:8px"></div><div class="label">sm</div><div class="val" style="color:var(--forest-700)">Tag</div></div><div style="text-align:center"><div style="width:72px;height:48px;background:#fff;border-radius:12px;box-shadow:0 3px 16px rgba(45,36,24,.07);margin-bottom:8px"></div><div class="label">card</div><div class="val" style="color:var(--forest-700)">Card</div></div><div style="text-align:center"><div style="width:72px;height:48px;background:#fff;border-radius:12px;box-shadow:0 8px 24px rgba(45,36,24,.10);margin-bottom:8px"></div><div class="label">md</div><div class="val" style="color:var(--forest-700)">Modal</div></div><div style="text-align:center"><div style="width:72px;height:48px;background:#fff;border-radius:12px;box-shadow:0 14px 40px rgba(45,36,24,.14);margin-bottom:8px"></div><div class="label">lg</div><div class="val" style="color:var(--forest-700)">FAB</div></div><div style="text-align:center"><div style="width:72px;height:48px;background:#fff;border-radius:12px;box-shadow:0 -8px 32px rgba(45,36,24,.12);margin-bottom:8px"></div><div class="label">sheet</div><div class="val" style="color:var(--forest-700)">Sheet</div></div>
</div>
</body></html>
