<!-- @dsCard group="Colors" viewport="700x160" name="Signals" subtitle="Food-as-medicine guidance — core product language" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 20px; font-family: var(--font-label); background: var(--surface-page); }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 8px; }
  .swatch { border-radius: 8px; text-align: center; }
  .label { font-size: 9px; color: var(--text-muted); margin-top: 4px; font-family: var(--font-label); letter-spacing: .06em; text-transform: uppercase; }
  .val { font-size: 8px; color: var(--text-muted); font-family: var(--font-label); }
</style></head><body>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">

<div style="border-radius:16px;overflow:hidden">
  <div style="height:44px;background:#2F8C5A;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;font-family:var(--font-label);font-weight:700">✓</div>
  <div style="background:#DCEDE2;padding:10px 12px">
    <div style="font-size:13px;font-weight:700;color:#2F8C5A;font-family:var(--font-label)">Beneficial</div>
    <div style="font-size:9px;color:var(--text-muted);margin-top:2px">#2F8C5A / #DCEDE2</div>
  </div>
</div>
<div style="border-radius:16px;overflow:hidden">
  <div style="height:44px;background:#C98A2E;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;font-family:var(--font-label);font-weight:700">!</div>
  <div style="background:#F6E8CB;padding:10px 12px">
    <div style="font-size:13px;font-weight:700;color:#C98A2E;font-family:var(--font-label)">Limit</div>
    <div style="font-size:9px;color:var(--text-muted);margin-top:2px">#C98A2E / #F6E8CB</div>
  </div>
</div>
<div style="border-radius:16px;overflow:hidden">
  <div style="height:44px;background:#C04A2F;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;font-family:var(--font-label);font-weight:700">✗</div>
  <div style="background:#F6DED5;padding:10px 12px">
    <div style="font-size:13px;font-weight:700;color:#C04A2F;font-family:var(--font-label)">Avoid</div>
    <div style="font-size:9px;color:var(--text-muted);margin-top:2px">#C04A2F / #F6DED5</div>
  </div>
</div>
<div style="border-radius:16px;overflow:hidden">
  <div style="height:44px;background:#3F6E86;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;font-family:var(--font-label);font-weight:700">ⓘ</div>
  <div style="background:#DDE8ED;padding:10px 12px">
    <div style="font-size:13px;font-weight:700;color:#3F6E86;font-family:var(--font-label)">Info</div>
    <div style="font-size:9px;color:var(--text-muted);margin-top:2px">#3F6E86 / #DDE8ED</div>
  </div>
</div>
</div>
</body></html>
