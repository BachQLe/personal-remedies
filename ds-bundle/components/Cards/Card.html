<!-- @dsCard group="Cards" -->
<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 32px; background: var(--app-bg); }
  .card {
    background: var(--card); border-radius: 24px; padding: 20px;
    box-shadow: var(--shadow-card); width: 100%; max-width: 360px;
  }
  .card-clickable { cursor: pointer; transition: transform 0.15s; }
  .card-clickable:active { transform: scale(0.98); }
  .card-title { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px; }
  .card-body { font-size: 14px; color: var(--ink); line-height: 1.5; }
  .label { font-size: 11px; color: var(--muted); font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; }
</style>
</head><body>
  <span class="label">Base Card</span>
  <div class="card">
    <p class="card-title">Your food profile</p>
    <p class="card-body">A rounded container with subtle shadow, used for grouping related content. Supports optional click interaction.</p>
  </div>

  <span class="label">Clickable Card</span>
  <div class="card card-clickable">
    <p class="card-title">Tap me</p>
    <p class="card-body">This card has a press scale animation on interaction.</p>
  </div>
</body></html>
