<!-- @dsCard group="Cards" -->
<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 32px; background: var(--app-bg); }
  .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .cat-card {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 16px; border-radius: 24px; background: #fff;
    box-shadow: var(--shadow-card); min-width: 80px; border: none;
    cursor: pointer; transition: transform 0.15s; font-family: var(--font-sans);
  }
  .cat-card:active { transform: scale(0.95); }
  .cat-icon {
    width: 48px; height: 48px; border-radius: 16px;
    display: flex; align-items: center; justify-content: center; font-size: 24px;
  }
  .cat-label { font-size: 12px; font-weight: 600; color: var(--ink); text-align: center; line-height: 1.3; }
  .cat-count { font-size: 12px; color: var(--muted); }
  .label { font-size: 11px; color: var(--muted); font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; }
</style>
</head><body>
  <span class="label">Category Cards</span>
  <div class="row">
    <button class="cat-card">
      <div class="cat-icon" style="background:rgba(52,168,83,0.1)">🥦</div>
      <span class="cat-label">Vegetables</span>
      <span class="cat-count">14</span>
    </button>
    <button class="cat-card">
      <div class="cat-icon" style="background:rgba(232,155,59,0.1)">🍎</div>
      <span class="cat-label">Fruits</span>
      <span class="cat-count">9</span>
    </button>
    <button class="cat-card">
      <div class="cat-icon" style="background:rgba(201,151,58,0.1)">🥜</div>
      <span class="cat-label">Nuts & Seeds</span>
      <span class="cat-count">7</span>
    </button>
    <button class="cat-card">
      <div class="cat-icon" style="background:rgba(74,144,217,0.1)">🐟</div>
      <span class="cat-label">Fish</span>
      <span class="cat-count">5</span>
    </button>
    <button class="cat-card">
      <div class="cat-icon" style="background:rgba(52,168,83,0.1)">🌿</div>
      <span class="cat-label">Spices & Herbs</span>
      <span class="cat-count">8</span>
    </button>
  </div>
</body></html>
