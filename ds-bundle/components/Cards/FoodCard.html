<!-- @dsCard group="Cards" -->
<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 32px; background: var(--app-bg); }
  .food-card {
    width: 100%; max-width: 380px; display: flex; align-items: center; gap: 16px;
    background: #fff; border-radius: 24px; padding: 16px;
    box-shadow: var(--shadow-card); cursor: pointer; transition: transform 0.15s;
    text-align: left; border: none; font-family: var(--font-sans);
  }
  .food-card:active { transform: scale(0.98); }
  .food-thumb {
    width: 64px; height: 64px; border-radius: 16px; overflow: hidden;
    flex-shrink: 0; background: #F7F7F8;
    display: flex; align-items: center; justify-content: center; font-size: 28px;
  }
  .food-info { flex: 1; min-width: 0; }
  .food-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .food-name { font-weight: 600; color: var(--ink); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .food-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .condition-tag {
    display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 9999px;
    font-size: 11px; font-weight: 600;
  }
  .signal-chip {
    display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px;
    border-radius: 9999px; font-size: 12px; font-weight: 600;
  }
  .signal-helpful { background: #EBF5EC; color: #1B6B2B; }
  .signal-avoid { background: #FDEAEA; color: #B0190E; }
  .food-studies { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .chevron { flex-shrink: 0; color: var(--muted); }
  .label { font-size: 11px; color: var(--muted); font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; }
</style>
</head><body>
  <span class="label">Helpful Food</span>
  <button class="food-card">
    <div class="food-thumb">🫐</div>
    <div class="food-info">
      <div class="food-header">
        <span class="food-name">Blueberries</span>
        <span class="signal-chip signal-helpful">✓</span>
      </div>
      <div class="food-tags">
        <span class="condition-tag" style="background:#EBF5EC;color:#1B6B2B">Type 2 Diabetes</span>
        <span class="condition-tag" style="background:#EAF0FB;color:#1A4FA0">Hypertension</span>
      </div>
      <p class="food-studies">12 studies</p>
    </div>
    <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
  </button>

  <span class="label">Avoid Food</span>
  <button class="food-card">
    <div class="food-thumb">🍞</div>
    <div class="food-info">
      <div class="food-header">
        <span class="food-name">White Bread</span>
        <span class="signal-chip signal-avoid">✗</span>
      </div>
      <div class="food-tags">
        <span class="condition-tag" style="background:#EBF5EC;color:#1B6B2B">Type 2 Diabetes</span>
      </div>
      <p class="food-studies">8 studies</p>
    </div>
    <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
  </button>
</body></html>
