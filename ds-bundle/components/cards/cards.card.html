<!-- @dsCard group="Components" viewport="700x420" name="Cards" subtitle="FoodCard · CategoryCard · StatRing · StudyCitationCard" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="../../_ds_bundle.js"></script>
</head><body style="padding:24px;display:flex;flex-direction:column;gap:20px">
<div id="food"></div>
<div id="cats"></div>
<div id="rings" style="max-width:320px"></div>
<div id="studies" style="max-width:540px"></div>
<script type="text/babel">
var ds = window.RemediDesign || {};
var FoodCard = ds.FoodCard, CategoryCard = ds.CategoryCard, StatRing = ds.StatRing, StudyCitationCard = ds.StudyCitationCard;
if (FoodCard) {
  ReactDOM.render(React.createElement('div',{style:{display:'flex',flexDirection:'column',gap:10}},
    React.createElement(FoodCard,{emoji:'🫐',name:'Blueberries',signal:'beneficial',conditions:[{label:'Type 2 Diabetes',colorKey:'diabetes'}],studyCount:12}),
    React.createElement(FoodCard,{emoji:'🍞',name:'White Bread',signal:'avoid',conditions:[{label:'Type 2 Diabetes',colorKey:'diabetes'}],studyCount:8})
  ), document.getElementById('food'));
  ReactDOM.render(React.createElement('div',{style:{display:'flex',gap:10}},
    React.createElement(CategoryCard,{emoji:'🥦',label:'Vegetables',count:14,colorKey:'vegetables'}),
    React.createElement(CategoryCard,{emoji:'🍎',label:'Fruits',count:9,colorKey:'fruits'}),
    React.createElement(CategoryCard,{emoji:'🥜',label:'Nuts',count:7,colorKey:'nuts'}),
    React.createElement(CategoryCard,{emoji:'🐟',label:'Fish',count:5,colorKey:'fish'})
  ), document.getElementById('cats'));
  ReactDOM.render(React.createElement('div',{style:{display:'flex',gap:24,alignItems:'center',background:'var(--surface-card)',borderRadius:20,padding:20,boxShadow:'var(--shadow-card)'}},
    React.createElement(StatRing,{value:24,max:30,label:'Helpful',color:'var(--benefit-600)'}),
    React.createElement('div',{style:{width:1,height:52,background:'var(--border-subtle)'}}),
    React.createElement(StatRing,{value:8,max:30,label:'Avoid',color:'var(--avoid-600)'})
  ), document.getElementById('rings'));
  ReactDOM.render(React.createElement('div',{style:{display:'flex',flexDirection:'column',gap:8}},
    React.createElement(StudyCitationCard,{journal:'NEJM',year:2023,title:'Dietary blueberry improves cardiometabolic outcomes in adults with metabolic syndrome',quality:'strong'}),
    React.createElement(StudyCitationCard,{journal:'Diabetes Care',year:2022,title:'Effect of daily avocado intake on lipid profile in type 2 diabetes',quality:'moderate'})
  ), document.getElementById('studies'));
}
</script>
</body></html>
