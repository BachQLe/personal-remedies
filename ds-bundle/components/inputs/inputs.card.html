<!-- @dsCard group="Components" viewport="700x360" name="Inputs" subtitle="SearchInput · StepBar · Toggle · ServingSizeStepper" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="../../_ds_bundle.js"></script>
</head><body style="padding:24px;display:flex;flex-direction:column;gap:20px;background:var(--lavender-300)">
<div id="search" style="max-width:400px"></div>
<div id="steps"></div>
<div id="toggles" style="background:var(--yellow-100);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:16px;max-width:420px"></div>
<div id="stepper" style="max-width:420px"></div>
<script type="text/babel">
const { SearchInput, StepBar, Toggle, ServingSizeStepper } = window.RemediDesign || {};
if (SearchInput) {
  ReactDOM.render(<SearchInput placeholder="Search conditions"/>, document.getElementById('search'));
  ReactDOM.render(<div style={{display:'flex',flexDirection:'column',gap:12,background:'var(--surface-card)',borderRadius:16,padding:16,maxWidth:360}}>
    <StepBar current={1} total={3}/><StepBar current={2} total={3}/><StepBar current={3} total={3}/>
  </div>, document.getElementById('steps'));
  ReactDOM.render(<>
    <Toggle checked={true} label="Show only beneficial" description="Filter to recommended foods"/>
    <Toggle checked={false} label="Hide allergens" description="Nuts, dairy, gluten"/>
  </>, document.getElementById('toggles'));
  ReactDOM.render(<ServingSizeStepper name="Blueberries" calories={128} value={1} unit="cup"/>, document.getElementById('stepper'));
}
</script>
</body></html>
