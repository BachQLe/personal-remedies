<!-- @dsCard group="Feedback" -->
<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 32px; background: var(--app-bg); }
  .empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 64px 24px; text-align: center; gap: 12px;
  }
  .empty-icon { font-size: 48px; }
  .empty-title { font-weight: 600; color: var(--ink); font-size: 18px; line-height: 1.3; }
  .empty-body { color: var(--muted); font-size: 14px; max-width: 280px; }
  .empty-action {
    padding: 10px 20px; border-radius: 9999px; background: var(--primary);
    color: #fff; font-size: 14px; font-weight: 600; border: none; cursor: pointer;
    font-family: var(--font-sans);
  }
  .label { font-size: 11px; color: var(--muted); font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; }
</style>
</head><body>
  <span class="label">Empty State</span>
  <div class="empty-state">
    <span class="empty-icon">🔍</span>
    <p class="empty-title">No foods yet</p>
    <p class="empty-body">Complete onboarding to see personalized food recommendations.</p>
    <button class="empty-action">Set up profile</button>
  </div>
</body></html>
