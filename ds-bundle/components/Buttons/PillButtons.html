<!-- @dsCard group="Buttons" -->
<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 32px; background: var(--cream); }
  .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .pill {
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 9999px; padding: 12px 24px; font-size: 15px; font-weight: 500;
    letter-spacing: -0.01em; cursor: pointer; border: none;
    transition: all 0.2s; font-family: var(--font-sans);
  }
  .pill:hover { transform: translateY(-1px); }
  .pill-forest { background: var(--forest); color: var(--cream); }
  .pill-forest:hover { background: var(--forest-deep); box-shadow: var(--shadow-lift); }
  .pill-amber { background: var(--amber); color: #fff; }
  .pill-amber:hover { filter: brightness(1.1); box-shadow: var(--shadow-lift); }
  .pill-ghost { background: #fff; color: var(--ink); border: 1px solid rgba(26,26,26,0.15); }
  .pill-ghost:hover { border-color: rgba(26,26,26,0.3); }
  .dark-row { background: var(--forest); border-radius: 16px; padding: 20px; }
  .pill-ghost-dark { background: transparent; color: var(--cream); border: 1px solid rgba(245,242,234,0.25); }
  .pill-ghost-dark:hover { background: rgba(245,242,234,0.1); }
  .label { font-size: 11px; color: var(--muted); font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; }
</style>
</head><body>
  <span class="label">Pill Variants</span>
  <div class="row">
    <button class="pill pill-forest">Forest</button>
    <button class="pill pill-amber">Amber</button>
    <button class="pill pill-ghost">Ghost</button>
  </div>
  <span class="label">Dark Background</span>
  <div class="dark-row row">
    <button class="pill pill-ghost-dark">Ghost Dark</button>
  </div>
</body></html>
