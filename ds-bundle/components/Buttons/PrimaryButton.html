<!-- @dsCard group="Buttons" -->
<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 32px; background: var(--app-bg); }
  .primary-btn {
    width: 100%; max-width: 320px; min-height: 52px; border-radius: 9999px;
    background: var(--primary); color: #fff; font-weight: 600; font-size: 16px;
    letter-spacing: -0.01em; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: opacity 0.15s;
    font-family: var(--font-sans);
  }
  .primary-btn:active { opacity: 0.8; }
  .primary-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .primary-btn.loading .spinner {
    width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff; border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .label { font-size: 11px; color: var(--muted); font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; }
</style>
</head><body>
  <span class="label">Default</span>
  <button class="primary-btn">Get your personalized plan</button>

  <span class="label">Disabled</span>
  <button class="primary-btn" disabled>Get your personalized plan</button>

  <span class="label">Loading</span>
  <button class="primary-btn loading"><div class="spinner"></div></button>
</body></html>
