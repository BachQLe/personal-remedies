<!-- @dsCard group="Buttons" -->
<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 32px; background: var(--app-bg); }
  .secondary-btn {
    width: 100%; max-width: 320px; min-height: 52px; border-radius: 9999px;
    background: #fff; color: var(--ink); font-weight: 600; font-size: 16px;
    letter-spacing: -0.01em; border: 1px solid var(--hairline);
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: opacity 0.15s; font-family: var(--font-sans);
    box-shadow: var(--shadow-card);
  }
  .secondary-btn:active { opacity: 0.7; }
  .secondary-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .label { font-size: 11px; color: var(--muted); font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; }
</style>
</head><body>
  <span class="label">Default</span>
  <button class="secondary-btn">Maybe later</button>

  <span class="label">Disabled</span>
  <button class="secondary-btn" disabled>Maybe later</button>
</body></html>
