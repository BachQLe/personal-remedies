<!-- @dsCard group="Layout" -->
<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--app-bg); height: 100vh; display: flex; align-items: flex-end; justify-content: center; }
  .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.4); }
  .sheet {
    position: relative; background: #fff; border-radius: 32px 32px 0 0;
    box-shadow: var(--shadow-sheet); max-height: 90vh; display: flex; flex-direction: column;
    width: 100%; max-width: 430px;
  }
  .handle-bar { display: flex; justify-content: center; padding: 12px 0 4px; flex-shrink: 0; }
  .handle { width: 40px; height: 4px; border-radius: 9999px; background: var(--hairline); }
  .sheet-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 20px 12px; border-bottom: 1px solid var(--hairline); flex-shrink: 0;
  }
  .sheet-title { font-weight: 700; color: var(--ink); font-size: 18px; }
  .close-btn {
    width: 32px; height: 32px; border-radius: 50%; background: #F7F7F8;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); border: none; cursor: pointer; font-size: 14px;
    font-family: var(--font-sans);
  }
  .sheet-body { overflow-y: auto; flex: 1; padding: 16px 20px; }
  .detail-row {
    display: flex; gap: 16px; margin-bottom: 20px;
  }
  .food-thumb {
    width: 80px; height: 80px; border-radius: 16px; background: #F7F7F8;
    display: flex; align-items: center; justify-content: center; font-size: 36px;
    flex-shrink: 0;
  }
  .detail-meta { display: flex; flex-direction: column; gap: 8px; justify-content: center; }
  .signal-chip {
    display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px;
    border-radius: 9999px; font-size: 12px; font-weight: 600;
    background: #EBF5EC; color: #1B6B2B; width: fit-content;
  }
  .studies-note { font-size: 12px; color: var(--muted); }
  .condition-section { background: #F7F7F8; border-radius: 16px; padding: 16px; margin-bottom: 12px; }
  .condition-tag {
    display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 9999px;
    font-size: 11px; font-weight: 600;
  }
  .see-studies { font-size: 12px; color: var(--primary); font-weight: 600; border: none; background: none; cursor: pointer; margin-top: 8px; font-family: var(--font-sans); }
</style>
</head><body>
  <div class="backdrop"></div>
  <div class="sheet">
    <div class="handle-bar"><div class="handle"></div></div>
    <div class="sheet-header">
      <h2 class="sheet-title">Blueberries</h2>
      <button class="close-btn">✕</button>
    </div>
    <div class="sheet-body">
      <div class="detail-row">
        <div class="food-thumb">🫐</div>
        <div class="detail-meta">
          <span class="signal-chip"><span>✓</span><span>Helpful</span></span>
          <p class="studies-note">12 studies behind this</p>
        </div>
      </div>
      <div class="condition-section">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
          <span class="condition-tag" style="background:#EBF5EC;color:#1B6B2B">Type 2 Diabetes</span>
          <span class="signal-chip" style="font-size:11px;padding:2px 8px">✓</span>
        </div>
        <button class="see-studies">See the studies →</button>
      </div>
      <div class="condition-section">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
          <span class="condition-tag" style="background:#EAF0FB;color:#1A4FA0">Hypertension</span>
          <span class="signal-chip" style="font-size:11px;padding:2px 8px">✓</span>
        </div>
        <button class="see-studies">See the studies →</button>
      </div>
    </div>
  </div>
</body></html>
