<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 32px; background: var(--app-bg); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 400px; }
  .condition-tag {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 12px; border-radius: 9999px;
    font-size: 12px; font-weight: 600; font-family: var(--font-sans);
  }
  .remove-btn {
    margin-left: 4px; opacity: 0.6; background: none; border: none;
    color: inherit; cursor: pointer; font-size: 10px; padding: 0;
  }
  .remove-btn:hover { opacity: 1; }
  .label { font-size: 11px; color: var(--muted); font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; }
</style>
</head><body>
  <span class="label">Condition Tags</span>
  <div class="row">
    <span class="condition-tag" style="background:#EBF5EC;color:#1B6B2B">Type 2 Diabetes</span>
    <span class="condition-tag" style="background:#EAF0FB;color:#1A4FA0">Hypertension</span>
    <span class="condition-tag" style="background:#FEF3E2;color:#915A00">High cholesterol</span>
    <span class="condition-tag" style="background:#F0EBFA;color:#5B2D9E">Chronic kidney disease</span>
    <span class="condition-tag" style="background:#FDEAEA;color:#B0190E">Heart failure</span>
    <span class="condition-tag" style="background:#EAF0FB;color:#1A4FA0">Depression</span>
  </div>

  <span class="label">With Remove Action</span>
  <div class="row">
    <span class="condition-tag" style="background:#EBF5EC;color:#1B6B2B">Type 2 Diabetes <button class="remove-btn">✕</button></span>
    <span class="condition-tag" style="background:#EAF0FB;color:#1A4FA0">Hypertension <button class="remove-btn">✕</button></span>
  </div>
</body></html>
