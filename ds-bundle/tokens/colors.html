<!-- @dsCard group="Tokens" -->
<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 32px; background: var(--app-bg); }
  h2 { font-size: 14px; font-weight: 700; color: var(--ink); margin: 0 0 12px; }
  .section { margin-bottom: 28px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
  .swatch {
    border-radius: 12px; overflow: hidden; background: #fff;
    box-shadow: var(--shadow-card);
  }
  .swatch-color { height: 48px; }
  .swatch-info { padding: 8px 10px; }
  .swatch-name { font-size: 11px; font-weight: 600; color: var(--ink); }
  .swatch-hex { font-size: 10px; color: var(--muted); font-family: monospace; }
</style>
</head><body>
  <div class="section">
    <h2>Core</h2>
    <div class="grid">
      <div class="swatch"><div class="swatch-color" style="background:#1B3A2D"></div><div class="swatch-info"><div class="swatch-name">primary</div><div class="swatch-hex">#1B3A2D</div></div></div>
      <div class="swatch"><div class="swatch-color" style="background:#1A1A1A"></div><div class="swatch-info"><div class="swatch-name">ink</div><div class="swatch-hex">#1A1A1A</div></div></div>
      <div class="swatch"><div class="swatch-color" style="background:#6B7280"></div><div class="swatch-info"><div class="swatch-name">muted</div><div class="swatch-hex">#6B7280</div></div></div>
      <div class="swatch"><div class="swatch-color" style="background:#ECECEE"></div><div class="swatch-info"><div class="swatch-name">hairline</div><div class="swatch-hex">#ECECEE</div></div></div>
      <div class="swatch"><div class="swatch-color" style="background:#F7F7F8"></div><div class="swatch-info"><div class="swatch-name">app-bg</div><div class="swatch-hex">#F7F7F8</div></div></div>
      <div class="swatch"><div class="swatch-color" style="background:#FFFFFF;border:1px solid #ECECEE"></div><div class="swatch-info"><div class="swatch-name">card</div><div class="swatch-hex">#FFFFFF</div></div></div>
    </div>
  </div>
  <div class="section">
    <h2>Brand</h2>
    <div class="grid">
      <div class="swatch"><div class="swatch-color" style="background:#1F4A3A"></div><div class="swatch-info"><div class="swatch-name">forest</div><div class="swatch-hex">#1F4A3A</div></div></div>
      <div class="swatch"><div class="swatch-color" style="background:#163528"></div><div class="swatch-info"><div class="swatch-name">forest-deep</div><div class="swatch-hex">#163528</div></div></div>
      <div class="swatch"><div class="swatch-color" style="background:#F5F2EA"></div><div class="swatch-info"><div class="swatch-name">cream</div><div class="swatch-hex">#F5F2EA</div></div></div>
      <div class="swatch"><div class="swatch-color" style="background:#7A9E7E"></div><div class="swatch-info"><div class="swatch-name">herb</div><div class="swatch-hex">#7A9E7E</div></div></div>
      <div class="swatch"><div class="swatch-color" style="background:#C9973A"></div><div class="swatch-info"><div class="swatch-name">gold</div><div class="swatch-hex">#C9973A</div></div></div>
      <div class="swatch"><div class="swatch-color" style="background:#D98A4A"></div><div class="swatch-info"><div class="swatch-name">amber</div><div class="swatch-hex">#D98A4A</div></div></div>
      <div class="swatch"><div class="swatch-color" style="background:#C4715A"></div><div class="swatch-info"><div class="swatch-name">terra</div><div class="swatch-hex">#C4715A</div></div></div>
      <div class="swatch"><div class="swatch-color" style="background:#CFE0D4"></div><div class="swatch-info"><div class="swatch-name">sage</div><div class="swatch-hex">#CFE0D4</div></div></div>
    </div>
  </div>
  <div class="section">
    <h2>Signal</h2>
    <div class="grid">
      <div class="swatch"><div class="swatch-color" style="background:#34A853"></div><div class="swatch-info"><div class="swatch-name">helpful</div><div class="swatch-hex">#34A853</div></div></div>
      <div class="swatch"><div class="swatch-color" style="background:#E5573F"></div><div class="swatch-info"><div class="swatch-name">avoid</div><div class="swatch-hex">#E5573F</div></div></div>
      <div class="swatch"><div class="swatch-color" style="background:#E89B3B"></div><div class="swatch-info"><div class="swatch-name">accent-amber</div><div class="swatch-hex">#E89B3B</div></div></div>
      <div class="swatch"><div class="swatch-color" style="background:#4A90D9"></div><div class="swatch-info"><div class="swatch-name">accent-blue</div><div class="swatch-hex">#4A90D9</div></div></div>
    </div>
  </div>
</body></html>
